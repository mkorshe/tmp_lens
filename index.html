lk tissue, a signal from one cell type is diluted by millions of other cells. Single-cell technologies split each person’s blood into thousands of individual cells.", "Genes that take part in the same process tend to switch on together — co-expression. We searched for DNA variants that change this coordination (co-eQTLs). The autoimmune-linked variant rs1131017 changed how RPS26 worked with protein-production genes in all cell types, but with T-cell activation genes only in T cells.", "A gene can only be read when its DNA is accessible and transcription factors bind to it. We measured both layers — gene activity and DNA accessibility — in the same cells. Variants that change both layers were up to 6.3 times more strongly linked to immune-related diseases. Thousands of variants narrow down to concrete candidates: a cell type, a DNA region, a factor and a target gene.", "To trust an effect for everyone, thousands of people are needed — more than one group can profile. Genetic data can identify a person, so it often cannot be shared. The answer is meta-analysis: each lab analyses its own data and shares only summary results. For single-cell data, weighting studies by cells per person and molecules per cell often works better than by number of participants alone.", "Together, the approaches form one chain: find candidate regulators (chapter 2), explain the mechanism with several molecular layers (chapter 3), and test the result across many people (chapter 4). The next step is experiments that prove the variants truly cause these effects — before this knowledge reaches the clinic and medicine that takes each person’s genetics into account."]};

function decode(el) {
  const fin = el.dataset.v || (el.dataset.v = el.textContent), t0 = performance.now(), dur = 900;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

}

function openLab(tab = labTab) {
  labTab = tab; const L = LAB[lang], o = $('over');
  o.innerHTML = `<div class="ov"><button class="x" data-close>×</button><div class="n">${L.t}</div>
    <div class="tabs">${L.tabs.map((s, i) => `<button data-tab="${i}" class="${i === tab ? 'on' : ''}">${s}</button>`).join('')}</div><div class="lab" id="labBody"></div></div>`;
  o.classList.add('on'); discover('lab:' + tab); labBody();
}
function labBody() {
  const L = LAB[lang], b = $('labBody'); if (!b) return;

  if (labTab === 1) {
    b.innerHTML = `<p>${L.lens}</p><label>${L.n}: <b id="vn">${P.n.toFixed(2)}</b><input type="range" id="rn" min="1.25" max="2.2" step="0.01" value="${P.n}"></label>
      <label>${L.rays}: <b id="vk">${P.k}</b><input type="range" id="rk" min="7" max="41" step="2" value="${P.k}"></label><div class="mono" id="vf"></div>`;
    const upd = () => { $('vf').textContent = `${L.f}: f = nR / 2(n−1) = ${(P.n / (2 * (P.n - 1))).toFixed(2)}R`; };
    upd(); goTo(1);
    $('rn').oninput = e => { P.n = +e.target.value; $('vn').textContent = P.n.toFixed(2); upd(); buildStream(); };
    $('rk').oninput = e => { P.k = +e.target.value; $('vk').textContent = P.k; buildStream(); };
    $('over').classList.add('side');
  } else $('over').classList.remove('side');
  if (labTab === 2) {
    b.innerHTML = `<p>${L.bulk}</p><label>${L.share}: <b id="vs">20%</b><input type="range" id="rs" min="2" max="80" value="20"></label><svg id="bulkSvg" viewBox="0 0 520 170" style="width:100%"></svg><div class="mono">${L.sch}</div>`;
    const draw = s => { const types = [[lang === 'uk' ? 'Т-клітини' : 'T cells', s / 100, 1, '#ff9b4a'], [lang === 'uk' ? 'B-клітини' : 'B cells', (1 - s / 100) * 0.3, 0, '#5ec8ff'], [lang === 'uk' ? 'моноцити' : 'monocytes', (1 - s / 100) * 0.4, 0, '#5dffa8'], ['NK', (1 - s / 100) * 0.3, 0, '#c08bff']];
      let x = 20, mix = ''; types.forEach(([n, f, , c]) => { mix += `<rect x="${x}" y="30" width="${f * 220}" height="22" fill="${c}"/>`; x += f * 220; });
      const bulk = s / 100;
      $('bulkSvg').innerHTML = `${mix}<text x="20" y="20" fill="var(--muted)" font-family="JetBrains Mono" font-size="11">${lang === 'uk' ? 'склад проби' : 'sample composition'}</text>
        <text x="300" y="20" fill="var(--muted)" font-family="JetBrains Mono" font-size="11">${L.effS}</text><rect x="300" y="30" width="200" height="22" fill="#ff9b4a"/><text x="300" y="68" fill="#ff9b4a" font-family="JetBrains Mono" font-size="12">100%</text>
        <text x="20" y="110" fill="var(--muted)" font-family="JetBrains Mono" font-size="11">${L.effB}</text><rect x="20" y="120" width="${Math.max(2, bulk * 480)}" height="22" fill="var(--acc)"/><text x="${Math.max(30, bulk * 480 + 28)}" y="136" fill="var(--acc)" font-family="JetBrains Mono" font-size="12">${Math.round(bulk * 100)}%</text>`; };
    draw(20); $('rs').oninput = e => { $('vs').textContent = e.target.value + '%'; draw(+e.target.value); };
  }
  if (labTab === 3) quizRender();
}
function quizRender() {
  const L = LAB[lang], Q = QUIZ[lang], b = $('labBody');
  if (quizI >= Q.length) { b.innerHTML = `<p>${L.res(quizS, Q.length)}</p><button class="btn" data-quiz-again>${L.again}</button>`; discover('quiz:done'); return; }
  const [q, opts] = Q[quizI]; shuffled = opts.map((o, i) => [o, i]).sort(() => Math.random() - 0.5);
  b.innerHTML = `<div class="mono">${quizI + 1} / ${Q.length} · ${L.quiz}</div><h4>${q}</h4>${shuffled.map(([o, i]) => `<button class="opt" data-ans="${i}">${o}</button>`).join('')}<div class="expl"></div>`;
}

// гра «Злови варіант»
let game = null;
function startGame() {
  $('over').classList.remove('on'); goTo(1); playing = true; $('play').textContent = '❚❚ ' + T[lang].ui.pause;
  game = { t0: performance.now(), n: 0 }; $('hud').classList.add('on');
}
function gameTick() {
  if (!game) return;
  const left = Math.max(0, 30 - (performance.now() - game.t0) / 1000);
  $('hud').textContent = `${LAB[lang].score}: ${game.n} · ${left.toFixed(0)} s`;
  if (left <= 0) { const n = game.n; game = null; $('hud').classList.remove('on'); discover('lab:game'); openLab(0); $('labBody').innerHTML = `<p>${LAB[lang].end(n)}</p><button class="btn solid" data-game>${LAB[lang].go}</button>`; }
}
function gameClick(e) {                       // знайти найближчу на екрані рожеву літеру
  const A = DNA.arr; if (!A) return;
  const fo = Math.floor(U.uOff.value), fr = U.uOff.value - fo, L = window.LOCUS.seq.length, v = new V3();
  let best = 22, hitN = -1;
  for (const [id, n] of DNA) {
    if (!SNPS.has((((id - fo) % L) + L) % L)) continue;
    v.set(A.P[n * 3] + A.D[n * 3] * fr * A.S[n], A.P[n * 3 + 1] + A.D[n * 3 + 1] * fr * A.S[n], A.P[n * 3 + 2]).project(camera);
    const dx = (v.x + 1) / 2 * innerWidth - e.clientX, dy = (1 - v.y) / 2 * innerHeight - e.clientY, d = Math.hypot(dx, dy);
    if (d < best) { best = d; hitN = n; }
  }
  const fx = document.createElement('div'); fx.className = 'burst' + (hitN >= 0 ? ' ok' : ''); fx.style.left = e.clientX + 'px'; fx.style.top = e.clientY + 'px';
  document.body.appendChild(fx); setTimeout(() => fx.remove(), 600);
  if (hitN >= 0) game.n++;
}

function applyTheme() {
  const t = TH[theme]; document.documentElement.dataset.theme = theme;
  halo.material.color.set(theme === 'dark' ? '#4a7dff' : '#7fc4ff'); halo.material.blending = theme === 'dark' ? THREE.AdditiveBlending : THREE.NormalBlending; halo.material.opacity = theme === 'dark' ? 0.4 : 0.5; halo.material.needsUpdate = true; U.uIn.value.set(t.inC); U.uOut.value.set(t.outC); U.uHl.value.set(t.hl);
  const dark = theme === 'dark';
  ballU.uTint.value.set(t.ball); ballU.uOp.value = t.ballOp; ballU.uRim.value.set(dark ? '#9fd8ff' : '#0b6fae'); wire.material.color.set(t.wire); wire.material.opacity = t.wireOp;
  // спектр типів клітин (Т, B, NK, моноцити, ДК); на світлому тлі — насиченіші
  (dark ? ['#ff9b4a', '#5ec8ff', '#c08bff', '#5dffa8', '#fff27a'] : ['#c2410c', '#0b6fae', '#7a3fb0', '#0f8a5f', '#8a5e00']).forEach((c, i) => U.uSpec.value[i].set(c));
  dust.material.color.set(dark ? '#9fc4ff' : '#5d6272'); dust.material.blending = dark ? THREE.AdditiveBlending : THREE.NormalBlending; dust.material.opacity = dark ? 0.55 : 0.35; dust.material.needsUpdate = true;
  threadMat.color.set(t.inC);
  // сяйво: на темному тлі світло додається, на світлому — звичайна кольорова пляма (інакше біліє)
  scene.traverse(o => { if (o.isSprite && o.material.map === glowTex && o !== halo) { o.material.blending = dark ? THREE.AdditiveBlending : THREE.NormalBlending; o.material.needsUpdate = true; } });
  $('theme').textContent = theme === 'dark' ? '☾' : '☀';
}

/* ══════════ КАМЕРА, СНОСКИ, ТОЧКИ ══════════ */
let yaw = 0, tYaw = 0, drag = null, sy = 0, off = 0;
const cur = [...VIEWS[0]];
$('gl').addEventListener('pointerdown', e => { drag = e.clientX; if (game) gameClick(e); });
addEventListener('pointermove', e => { if (drag != null) { tYaw -= (e.clientX - drag) * 0.005; drag = e.clientX; } });
addEventListener('pointerup', () => { drag = null; });
const ease = t => t * t * (3 - 2 * t);
function resize() {
  renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  U.uPx.value = innerHeight * renderer.getPixelRatio() / (2 * Math.tan(camera.fov * Math.PI / 360));
  $('leads').setAttribute('viewBox', `0 0 ${innerWidth} ${innerHeight}`);
}
addEventListener('resize', resize);
const scr = w => { const a = new V3(...w).project(camera); return [(a.x + 1) / 2 * innerWidth, (1 - a.y) / 2 * innerHeight, a.z]; };
function overlays() {
  const out = [], col = TH[theme].lead;
  document.querySelectorAll('.note[data-i]').forEach(el => {
    const r = el.getBoundingClientRect(), vis = 1 - Math.min(1, Math.abs(r.top + r.height / 2 - innerHeight / 2) / (innerHeight * 0.4));
    if (vis <= 0.02) return;
    const [x0, y0, z0, side] = ANCH[+el.dataset.i], [x, y] = scr([x0, y0, z0]), ex = side === 'right' ? r.left : r.right, ey = Math.max(r.top + 20, Math.min(r.bottom - 20, y));
    out.push(`<g opacity="${vis.toFixed(2)}"><path d="M${ex} ${ey} L${x} ${y}" stroke="${col}" fill="none"/><circle cx="${x}" cy="${y}" r="3" fill="${col}"/></g>`);
  });
  $('leads').innerHTML = out.join('');
  // точки-сноски: мітка на об’єкті + лінія до кнопки з підписом; рухаються разом з об’єктом
  const hl = [], busy = $('modal').classList.contains('on');
  document.querySelectorAll('.hot').forEach((h, n) => {
    const [k, at, [dx, dy], secs] = HOTS[n], w = secs.includes(curSec()) ? at() : null; if (!w) { h.style.opacity = 0; h.style.pointerEvents = 'none'; return; }
    const [x, y, z] = scr(w.toArray()), lx = x + dx, ly = y + dy;
    const show = !busy && z < 1 && x > 10 && x < innerWidth - 10 && y > 50 && y < innerHeight - 10 && lx > 10 && lx < innerWidth - 120 && ly > 60 && ly < innerHeight - 30 && ((k !== 'bead' && k !== 'cell') || gemV > 0.5);
    h.style.transform = `translate(${lx}px, ${ly - 12}px)`; h.style.opacity = show ? 1 : 0; h.style.pointerEvents = show ? 'auto' : 'none';
    if (show) hl.push(`<path d="M${x} ${y} L${lx} ${ly}" stroke="${TH[theme].hlLine}" fill="none"/><circle cx="${x}" cy="${y}" r="5" fill="none" stroke="${TH[theme].hlLine}"/><circle cx="${x}" cy="${y}" r="1.8" fill="${TH[theme].hlLine}"/>`);
  });
  $('leads').innerHTML += hl.join('');
}

render(); applyTheme(); resize();
const clock = new THREE.Clock(); let last = 0, gemV = 0, lastSY = scrollY;
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime(), dt = Math.min(0.05, t - last); last = t;
  const k = 1 - Math.exp(-dt * 4);
  sy += (scrollY - sy) * (1 - Math.exp(-dt * 7));
  if (fly) { const u = Math.min(1, (performance.now() - fly.t0) / fly.dur), e = u < 0.5 ? 4 * u * u * u : 1 - (-2 * u + 2) ** 3 / 2;
    scrollTo({ top: fly.from + (fly.to - fly.from) * e, behavior: 'instant' }); if (u >= 1) fly = null; }
  // швидкість прокрутки → ширший кут камери (відчуття польоту)
  const vel = Math.abs(scrollY - lastSY) / Math.max(1, innerHeight) / Math.max(dt, 1e-3); lastSY = scrollY;
  const fov = 40 + Math.min(14, vel * 7);
  if (Math.abs(camera.fov - fov) > 0.01) { camera.fov += (fov - camera.fov) * (1 - Math.exp(-dt * 5)); camera.updateProjectionMatrix();
    U.uPx.value = innerHeight * renderer.getPixelRatio() / (2 * Math.tan(camera.fov * Math.PI / 360)); }
  $('prog').style.transform = `scaleX(${(scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight)).toFixed(4)})`;
  const on = curSec();
  document.querySelectorAll('#rail [data-go]').forEach(b => b.classList.toggle('on', b.dataset.go === String(on)));
  const p = THREE.MathUtils.clamp(sy / Math.max(1, innerHeight), 0, VIEWS.length - 1) || 0, i = Math.min(VIEWS.length - 2, Math.floor(p)), f = ease(p - i);
  SW = st => Math.max(0, 1 - Math.abs(p - st));
  const A = VIEWS[i], B = VIEWS[i + 1];
  for (let n = 0; n < 6; n++) cur[n] += (A[n] + (B[n] - A[n]) * f - cur[n]) * k;          // облітання по орбіті
  yaw += (tYaw - yaw) * k;
  const ct = new V3(cur[0], cur[1], cur[2]), yw = cur[4] + yaw, pt = cur[5];
  camera.position.set(ct.x + cur[3] * Math.sin(yw) * Math.cos(pt), ct.y + cur[3] * Math.sin(pt), ct.z + cur[3] * Math.cos(yw) * Math.cos(pt));
  camera.lookAt(ct);
  if (playing) off += dt * P.flow;
  U.uOff.value = off;
  gemV += ((gemOn ? 1 : 0) - gemV) * k; gem.visible = gemV > 0.01; gem.rotation.y = t * 0.3;
  const gw = gemV * Math.max(SW(0), SW(1)); gem.visible = gw > 0.01;               // вміст GEM — лише на екрані лінзи
  for (const m of gemMats) m.opacity = m.userData.op * gw;
  wire.material.color.set(gemOn ? TH[theme].hlLine.replace(/rgba\((\d+),(\d+),(\d+).*/, 'rgb($1,$2,$3)') : TH[theme].wire); wire.material.opacity = TH[theme].wireOp * (1 + 3 * gemV * SW(1));
  animLayers(t);
  ballU.uT.value = t;
  U.uDisp.value = Math.max(SW(1), 0.6 * SW(5));                                   // призма: спектр клітин у розділі 1 і в загальній картині
  dust.rotation.y = t * 0.012; dust.position.y = Math.sin(t * 0.1) * 0.2;

});
</script>
